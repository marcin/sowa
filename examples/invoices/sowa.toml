# Katalog główny projektu Sowa. Ścieżki po doc i why liczą się od katalogu docs.
[project]
name = "invoices"
src  = "src"    # specyfikacja: typy, sygnatury z uprawnieniami, opisy, przykłady
impl = "impl"   # ciała funkcji; pilnują ich kompilator, testy i uprawnienia
docs = "docs"

# Limity dokumentacji przy kodzie. Po przekroczeniu `sowa check` prosi
# o przeniesienie tekstu lub przykładów do .md. Bez tej sekcji obowiązują
# wartości domyślne języka (te same co tutaj).
[limits]
desc_lines    = 3   # linii w desc; dłuższy opis przenieś do .md i wskaż przez doc
examples      = 3   # example i property na funkcję; resztę przenieś do bloków sowa w .md
example_lines = 5   # linii w jednym przykładzie

# Zasoby, które runtime przekazuje do main według nazwy parametru:
# fn main(db: Db, clock: Clock, mail: Mailer). Innych uprawnień program nie ma,
# bo uprawnienia nie da się utworzyć w kodzie. Adres z `mail` jest też jedynym
# połączeniem sieciowym, na które pozwala runtime.
# Uzasadnienie w docs/zalozenia.md#obliczenia-i-uprawnienia.
[resources]
db    = { type = "Db", url = "postgres://localhost/invoices" }
clock = { type = "Clock" }
mail  = { type = "Mailer", server = "smtp.firma.pl:587" }

# Zatwierdzanie podpisanym commitem, przy pracy bez PR albo na jednym koncie.
# Zob. docs/zatwierdzanie.md w repozytorium Sowy.
# [review]
# approvers = ["reviewer@intum.com"]
# sign      = true
# agent     = "sowa-reviewer"   # drugi agent zatwierdza tylko rozszerzenia i zwykłe zmiany
