# Katalog główny projektu Sowa. Ścieżki po doc i why liczą się od katalogu docs.
[project]
name = "invoices"
src  = "src"    # specyfikacja: typy, sygnatury z uprawnieniami, opisy, przykłady
impl = "impl"   # ciała funkcji; pilnują ich kompilator, testy i uprawnienia
docs = "docs"

# Limity dokumentacji przy kodzie. Po przekroczeniu `sowa check` prosi
# o przeniesienie tekstu lub przykładów do .md. Bez tej sekcji obowiązują
# wartości domyślne języka (te same co tutaj).
[limits]
desc_lines    = 3   # linii w desc; dłuższy opis przenieś do .md i wskaż przez doc
examples      = 3   # example i property na funkcję; resztę przenieś do bloków sowa w .md
example_lines = 5   # linii w jednym przykładzie

# Zasoby, które runtime przekazuje do main według nazwy parametru:
# fn main(db: Db, clock: Clock, mail: Mailer, web: Server). Innych uprawnień program
# nie ma, bo uprawnienia nie da się utworzyć w kodzie. Adresy z `db`, `mail` i `web`
# to jedyne połączenia sieciowe, na które pozwala runtime.
# Uzasadnienie w docs/zalozenia.md#obliczenia-i-uprawnienia.
# Baza to plik SQLite obok sowa.toml. smtp.firma.pl to serwer wymyślony na potrzeby przykładu,
# więc bez --fake mail wysyłka kończy się komunikatem „Serwer poczty nie odpowiada”.
# Nadawcę podaje from, a login do serwera (użytkownik:hasło) runtime czyta ze zmiennej SMTP_LOGIN.
[resources]
db    = { type = "Db", url = "sqlite:invoices.db" }
clock = { type = "Clock" }
mail  = { type = "Mailer", server = "smtp.firma.pl:587", from = "faktury@firma.pl", login_env = "SMTP_LOGIN" }
web   = { type = "Server", listen = "0.0.0.0:8080" }

# Zasoby dla sowa test i sowa run --fake: bez połączeń z siecią.
# server = "memory": wiadomości nigdzie nie wychodzą, a mail.send zwraca Sent.
[resources.test]
db    = { type = "Db", url = "memory" }
clock = { type = "Clock", now = "2026-09-27T10:00:00" }
mail  = { type = "Mailer", server = "memory" }

# Zatwierdzanie podpisanym commitem, przy pracy bez PR albo na jednym koncie.
