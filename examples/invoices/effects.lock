# Szkic formatu. Generuje `sowa review`, nie edytuj ręcznie.
# Plik należy do właściciela w CODEOWNERS: agent może przygotować wpis, ale PR wymaga zgody człowieka.
# W trybie spec sygnatury z src/ chroni CODEOWNERS, więc tu są tylko wiersze dla kodu,
# który człowiek czyta, i mapy efektów modułów.

# Funkcje z efektami z approve = true w plikach z [review] read.
# Nowa funkcja z takim efektem albo zmiana jej sygnatury lub efektów wymaga ponownego zatwierdzenia.
# funkcja                plik                  efekty                 hash    kto                    zatwierdzone
save_with_next_number    impl/numbering.sowa   Db.read, Db.write      6f1b2e  reviewer@intum.com     2026-09-27
save_invoice             impl/numbering.sowa   Db.write               c29e40  reviewer@intum.com     2026-09-27

# Mapy efektów modułów z [review.files] w sowa.toml: jeden wiersz na efekt w module.
# Ponownego zatwierdzenia wymaga nowy efekt albo nowa funkcja, w której efekt powstaje.
# moduł                efekt      gdzie powstaje                hash    kto                    zatwierdzone
src/issuing.sowa       Clock      issue_invoice                 3b8e51  reviewer@intum.com     2026-09-27
src/issuing.sowa       Db.read    issue_invoice                 e07a2c  reviewer@intum.com     2026-09-27
src/issuing.sowa       Db.write   issue_invoice                 4d19f6  reviewer@intum.com     2026-09-27
