# Wspólny projekt dla przykładów 01–07. Ścieżki po doc i why liczą się od katalogu docs.
# Przykładowy projekt invoices/ ma własny sowa.toml, który obowiązuje w jego katalogu.
[project]
name = "examples"
src  = "."
docs = "docs"

# Zasoby, czyli jedyne uprawnienia, jakie program dostaje (main w 03_capabilities.sowa).
[resources]
db   = { type = "Db", url = "postgres://localhost/examples" }
mail = { type = "Mailer", server = "smtp.firma.pl:587" }
